name: macOS build

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on macOS
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13.7'

    - name: Toolchain Cache
      id: mac-toolchain
      uses: actions/cache@v6
      with:
        path: ~/mac-toolchain
        key: ${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('**/scripts/mac-toolchain-build') }}

    - name: Cargo-C Toolchain Cache
      id: mac-cargo-c-toolchain
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/cargo-capi
          ~/.cargo/bin/cargo-cbuild
          ~/.cargo/bin/cargo-cinstall
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-c-toolchain-${{ hashFiles('**/scripts/mac-toolchain-build') }}

    - name: Setup Environment
      run: |
        echo ~/mac-toolchain/bin >> $GITHUB_PATH
        rustup target add x86_64-apple-darwin
        xcodebuild -downloadComponent MetalToolchain

    - name: Setup Toolchain
      if: steps.mac-toolchain.outputs.cache-hit != 'true'
      run: |
        pip install setuptools
        scripts/mac-toolchain-build ~/mac-toolchain

    - name: Setup Cargo-C Toolchain
      if: steps.mac-cargo-c-toolchain.outputs.cache-hit != 'true'
      run: |
        cargo install cargo-c

    - name: Build HandBrake
      run: |
        ./configure
        cd build
        make ub && make pkg.create

    - name: Upload Assets
      uses: actions/upload-artifact@v7
      with:
        name: HandBrake-macos
        path: ./build/pkg

  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    # windows.yml's publish_release job is the sole release creator for a
    # tag; creating from multiple workflows races (422/duplicate releases).
    # Wait for the release to exist, then attach this workflow's artifacts.
    - name: Wait for release and upload artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        for i in $(seq 1 90); do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            find artifacts -type f -print0 | \
              xargs -0 -r gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "Release for $TAG not created yet (windows.yml creates it); retrying in 2m ($i/90)"
          sleep 120
        done
        echo "Timed out waiting for release $TAG" >&2
        exit 1
