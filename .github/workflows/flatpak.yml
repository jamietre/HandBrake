name: Flatpak Build

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flatpak Build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake build-essential cmake git libnuma-dev libtool libtool-bin m4 make meson nasm ninja-build patch pkg-config tar flatpak flatpak-builder
        sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.llvm21//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08

    - name: Build HandBrake
      run: |
        ./configure --launch-jobs=1 --flatpak --enable-qsv --enable-vce --enable-nvdec --enable-libdovi
        cd build
        nice make pkg.create.gui.flatpak

    - name: Build HandBrake Plugins
      run: |
        cd build
        nice make pkg.create.plugins.flatpak

    - name: Upload Package
      uses: actions/upload-artifact@v7
      with:
        name: HandBrake
        path: ./build/pkg/flatpak/*.flatpak

  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    # windows.yml's publish_release job is the sole release creator for a
    # tag; creating from multiple workflows races (422/duplicate releases).
    # Wait for the release to exist, then attach this workflow's artifacts.
    - name: Wait for release and upload artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        for i in $(seq 1 90); do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            find artifacts -type f -print0 | \
              xargs -0 -r gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "Release for $TAG not created yet (windows.yml creates it); retrying in 2m ($i/90)"
          sleep 120
        done
        echo "Timed out waiting for release $TAG" >&2
        exit 1
